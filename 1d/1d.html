<!-- 1(d). Handle Click Events for HTML Button -->

<!DOCTYPE html>
<html>
<head>
    <title>Click Event</title>
</head>
<body>
<script>
  	function changeText() {
    		document.getElementById("message").innerHTML ="Button Clicked Successfully!";
		}
</script>

<h2 id="message">Welcome</h2>

<button onclick="changeText()">Click Me</button>

</body>
</html>
